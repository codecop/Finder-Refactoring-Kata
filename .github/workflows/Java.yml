name: Test Java

on:
  push:
    paths:
      - 'Java/**'
      - '.github/workflows/Java.yml'
  pull_request:
    paths:
      - 'Java/**'
      - '.github/workflows/Java.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v2

    - name: Set up Java
      uses: actions/setup-java@v1
      with:
        java-version: 1.8

    - name: Build and test
      working-directory: Java
      run: mvn -B test
